<title>Checkout · ENESMA Shop</title>
<script>
(function () {
  var path = location.pathname, marker = '/enesma-shop/', i = path.indexOf(marker);
  window.SHOP_BASE = i >= 0 ? path.slice(0, i + marker.length) : '/';
  document.write('<base href="' + window.SHOP_BASE + '">');
})();
</script>
