<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENESMA Shop</title>
<script>
(function () {
  var path = location.pathname, marker = '/enesma-shop/', i = path.indexOf(marker);
  window.SHOP_BASE = i >= 0 ? path.slice(0, i + marker.length) : '/';
  var v = '20261120p';
  var b = window.SHOP_BASE;
  document.write('<base href="' + b + '">');
  document.write('<link rel="stylesheet" href="' + b + 'css/shop.css?v=' + v + '">');
  document.write('<link rel="icon" href="' + b + 'favicon-32.png" type="image/png">');
  document.write('<link rel="apple-touch-icon" href="' + b + 'apple-touch-icon.png">');
  var introOn = true;
  try { introOn = sessionStorage.getItem('enesma_shop_intro_seen') !== '1'; } catch (err) {}
  if (!introOn && /[?&]intro=(replay|capture)(?:&|$)/.test(location.search)) introOn = true;
  window.__ESHOP_INTRO = introOn;
  if (introOn) {
    document.write('<link rel="stylesheet" href="' + b + 'css/intro.css?v=' + v + '">');
    document.documentElement.classList.add('eshop-intro-on');
    setTimeout(function () {
      if (!document.querySelector('.eshop-intro')) document.documentElement.classList.remove('eshop-intro-on');
    }, 4000);
  }
})();
</script>

<meta name="theme-color" content="#fbfbfb">
<meta name="description" content="ENESMA Shop. Gear, signs, and cards for ENESMA Realty.">
</head>
<body data-page="home">
<div id="app"></div>
<script>
document.write('<script src="' + window.SHOP_BASE + 'js/config.js?v=20261120p"><\/script>');
document.write('<script src="' + window.SHOP_BASE + 'js/catalog.js?v=20261120p"><\/script>');
document.write('<script src="' + window.SHOP_BASE + 'js/cart.js?v=20261120p"><\/script>');
document.write('<script src="' + window.SHOP_BASE + 'js/api.js?v=20261120p"><\/script>');
document.write('<script src="' + window.SHOP_BASE + 'js/ui.js?v=20261120p"><\/script>');
document.write('<script src="' + window.SHOP_BASE + 'js/main.js?v=20261120p"><\/script>');
if (window.__ESHOP_INTRO) document.write('<script src="' + window.SHOP_BASE + 'js/intro.js?v=20261120p-white"><\/script>');
</script>
</body>
</html>
